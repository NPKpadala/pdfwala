# =============================================================================
# PDFWala tool manifest — SINGLE SOURCE OF TRUTH (module: pdf)
# Every system (Flask routes, SEO pages, sitemap, nav, related links, JSON-LD,
# future mobile app / public API / admin panel) derives from this file.
# Add a tool = add ONE entry here, run `python platform/build.py`, done.
#
# i18n: language-neutral fields live at the top level; all human copy lives under
# content.<locale>. Add a language later by adding content.es / content.hi, and
# (optionally) slugs.<locale>, without changing the architecture.
# =============================================================================

# Shared defaults (YAML merge key <<: *base applies these; override any field).
_base: &base
  module: pdf
  status: draft            # draft = API route only; published = also gets an SEO page
  priority: 50
  search_volume: low
  difficulty: medium
  monetization_priority: 3
  schema_type: WebApplication
  icon: file
  hero_image: null
  processing: { field: file, multi: false, output_ext: pdf, async: false, max_mb: 10, queue: fast }
  supported_extensions: [pdf]
  output_extensions: [pdf]
  flags: { supports_api: true, supports_batch: false, supports_ai: false, supports_mobile: true, premium: false }
  related: []
  guide_links: []
  comparison_links: []
  industry_links: []

tools:

# ---- OPTIMIZE ----------------------------------------------------------------
- <<: *base
  id: compress_pdf
  slug: compress-pdf
  route: /compress
  category: optimize
  engine: compress_pdf
  status: published
  priority: 1
  search_volume: high
  monetization_priority: 1
  success_msg: PDF compressed successfully
  related: [merge-pdf, split-pdf, pdf-to-word, pdf-to-jpg, watermark-pdf]
  content:
    en:
      display_name: Compress PDF
      short_description: Reduce PDF file size online while keeping text sharp.
      seo_title: "Compress PDF - Reduce PDF File Size Online Free | PDFWala"
      seo_description: "Compress PDF files online for free. Shrink large PDFs for email and upload while keeping text sharp. Choose your quality level. Files auto-delete in 2 hours."
      seo_keywords: [compress pdf, reduce pdf size, pdf compressor, shrink pdf, compress pdf online]
      h1: Compress PDF
      intro: "Reduce the size of a PDF in seconds - smaller files for email, faster uploads, and easier sharing, with text kept crisp and readable."
      what: "Compress PDF shrinks a PDF's file size by re-encoding and down-sampling the images inside it and cleaning up redundant data, without changing the page layout. Scanned documents and image-heavy PDFs often drop by 80-95%, while the text stays selectable and sharp. You choose how hard to compress: from a gentle, near-lossless pass to maximum compression for the smallest possible file."
      why: "Email providers reject attachments over 10-25 MB, portals cap uploads, and large PDFs are slow to open and share. A 30 MB scanned contract that won't send becomes a 2 MB file that attaches instantly - without you having to re-scan or retype anything. If a PDF is already optimized, we tell you honestly instead of degrading it for a meaningless gain."
      steps:
        - { t: Upload, d: "Drop your PDF into the box above or click to browse." }
        - { t: Choose a level, d: "Pick a compression level - Recommended works for most files; Maximum makes the smallest file." }
        - { t: Compress, d: "Click Compress PDF and we process it on our servers." }
        - { t: Download, d: "Grab your smaller PDF. It is deleted automatically within 2 hours." }
      features:
        - { t: "Real compression, every level", d: "Each level actually reduces size - we force image down-sampling so 'gentle' still saves space." }
        - { t: Quality you control, d: "From near-lossless to maximum shrink, you decide the trade-off between size and clarity." }
        - { t: Keeps text selectable, d: "We compress images, not your text layer, so the document stays searchable and crisp." }
        - { t: Honest results, d: "Already-optimized files are left untouched with a clear note instead of a fake percentage." }
      benefits:
        - Send large PDFs that were too big to email.
        - Upload to portals with strict size limits.
        - Save storage and speed up sharing.
        - No watermarks and no sign-up.
      use_cases:
        - Emailing a scanned contract or ID that exceeds the attachment limit.
        - Uploading a portfolio or report to a job or grant portal.
        - Shrinking a photo-heavy brochure before sending to a client.
        - Reducing a batch of scanned invoices for accounting software.
      security: "Your file is uploaded over an encrypted HTTPS connection, processed automatically on our own servers, and deleted within 2 hours. We never share or sell your documents, we never use them to train any model, and no human ever opens them. You do not need an account."
      faqs:
        - { q: "Will compressing reduce the quality of my PDF?", a: "It depends on the level you pick. The gentle level is visually near-lossless; higher levels down-sample images more to save space. Text always stays sharp because we compress images, not text." }
        - { q: "Why did my file only shrink a little?", a: "Some PDFs - especially text-only or already-compressed exports - are already optimized. When that happens we keep the file at its original quality and tell you it is already optimized rather than degrade it for a negligible gain." }
        - { q: "Is there a file size limit?", a: "The free tier accepts files up to 10 MB. If your PDF is larger, try splitting it first or contact us." }
        - { q: "Do you keep my files?", a: "No. Files are processed automatically and deleted within 2 hours. Nothing is shared or used to train models." }
        - { q: "Does it work on scanned PDFs?", a: "Yes - scanned and image-heavy PDFs compress the most, often by 80-95%." }
      widget_params:
        - { name: quality, type: select, label: Compression level, default: medium,
            options: [ {value: low, label: "Less (best quality)"}, {value: medium, label: Recommended},
                       {value: high, label: Strong}, {value: maximum, label: "Maximum (smallest)"} ] }
      cta_h: "Ready to shrink your PDF?"
      cta_p: "Free, private, and no sign-up. Your file auto-deletes in 2 hours."
      cta_btn: Compress a PDF now
      cta: Compress PDF

- { <<: *base, id: repair_pdf,    slug: repair-pdf,    route: /repair,    category: optimize, engine: repair_pdf,    success_msg: PDF repaired successfully }
- { <<: *base, id: linearize_pdf, slug: linearize-pdf, route: /linearize, category: optimize, engine: linearize_pdf, success_msg: PDF linearized successfully }

