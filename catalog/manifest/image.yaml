# =============================================================================
# PDFWala tool manifest — module: image  (auto-discovered by build.py)
# Same schema as pdf.yaml. Adding a module = add a file like this; no code change.
# =============================================================================
meta:
  module: image
  label: Image
  icon: image
  order: 2
  manifest_version: "1.0.0"

_base: &base
  module: image
  status: draft
  priority: 50
  subcategory: null
  featured: false
  popular: false
  hidden: false
  experimental: false
  deprecated: false
  search_volume: low
  difficulty: medium
  monetization_priority: 3
  schema_type: WebApplication
  icon: image
  hero_image: null
  aliases: []
  processing: { field: file, multi: false, output_ext: jpg, async: false, max_mb: 10, queue: fast }
  supported_extensions: [jpg, jpeg, png, webp, bmp, tiff, gif]
  output_extensions: [jpg]
  flags: { supports_api: true, supports_batch: false, supports_ai: false, supports_mobile: true, premium: false }
  related: []
  guide_links: []
  comparison_links: []
  industry_links: []

tools:
# ---- COMPRESS / RESIZE -------------------------------------------------------
- { <<: *base, id: compress_image, slug: compress-image, route: /compress, category: compress, engine: compress_image, priority: 10, search_volume: high, aliases: [reduce image size, shrink image], success_msg: Image compressed }
- { <<: *base, id: resize_image,   slug: resize-image,   route: /resize,   category: resize,   engine: resize_image,   priority: 11, search_volume: high, aliases: [image resizer], success_msg: Image resized }

# ---- CONVERT -----------------------------------------------------------------
- { <<: *base, id: convert_image, slug: convert-image, route: /convert, category: convert, engine: convert_image, success_msg: Image converted, aliases: [image converter], processing: { field: file, multi: false, output_ext: jpg, output_ext_from: format, async: false, max_mb: 10, queue: fast }, output_extensions: [jpg, png, webp, bmp, tiff] }
- { <<: *base, id: image_to_pdf,  slug: image-to-pdf,  route: /to-pdf,  category: convert, engine: image_to_pdf,  priority: 12, search_volume: high, aliases: [jpg to pdf, picture to pdf], success_msg: Image converted to PDF, output_ext: pdf, output_extensions: [pdf] }
- { <<: *base, id: images_to_pdf, slug: images-to-pdf, route: /to-pdf/multiple, category: convert, engine: images_to_pdf, success_msg: Images merged to PDF, processing: { field: files, multi: true, output_ext: pdf, async: false, max_mb: 10, queue: fast }, output_extensions: [pdf] }
- { <<: *base, id: png_to_jpg,    slug: png-to-jpg,    route: /png-to-jpg,  category: convert, engine: png_to_jpg,    success_msg: PNG converted to JPG, supported_extensions: [png], output_extensions: [jpg] }
- { <<: *base, id: webp_to_jpg,   slug: webp-to-jpg,   route: /webp-to-jpg, category: convert, engine: webp_to_jpg,   success_msg: WebP converted to JPG, supported_extensions: [webp], output_extensions: [jpg] }
- { <<: *base, id: image_to_excel, slug: image-to-excel, route: /to-excel, category: convert, engine: image_to_excel, success_msg: "Image OCR to Excel", output_ext: xlsx, output_extensions: [xlsx] }
- { <<: *base, id: image_to_word,  slug: image-to-word,  route: /to-word,  category: convert, engine: image_to_word,  success_msg: "Image OCR to Word", output_ext: docx, output_extensions: [docx] }

# ---- EDIT --------------------------------------------------------------------
- { <<: *base, id: crop_image,      slug: crop-image,      route: /crop,      category: edit, engine: crop_image,      success_msg: Image cropped }
- { <<: *base, id: rotate_image,    slug: rotate-image,    route: /rotate,    category: edit, engine: rotate_image,    success_msg: Image rotated }
- { <<: *base, id: flip_image,      slug: flip-image,      route: /flip,      category: edit, engine: flip_image,      success_msg: Image flipped }
- { <<: *base, id: grayscale_image, slug: grayscale-image, route: /grayscale, category: edit, engine: grayscale_image, success_msg: Image converted to grayscale }
- { <<: *base, id: enhance_image,   slug: enhance-image,   route: /enhance,   category: edit, engine: enhance_image,   success_msg: Image enhanced }
- { <<: *base, id: watermark_image, slug: watermark-image, route: /watermark, category: edit, engine: watermark_image, success_msg: Watermark added }
- { <<: *base, id: add_text_image,  slug: add-text-image,  route: /add-text,  category: edit, engine: add_text_image,  success_msg: Text added to image }
- { <<: *base, id: merge_images,    slug: merge-images,    route: /merge,     category: edit, engine: merge_images,    success_msg: Images merged, processing: { field: files, multi: true, output_ext: jpg, async: false, max_mb: 10, queue: fast } }

# ---- AI ----------------------------------------------------------------------
- { <<: *base, id: remove_bg, slug: remove-background, route: /remove-bg, category: ai, engine: remove_bg, priority: 13, search_volume: high, aliases: [background remover, remove image background], success_msg: Background removed, output_ext: png, output_extensions: [png], flags: { supports_api: true, supports_batch: false, supports_ai: true, supports_mobile: true, premium: false } }

categories:
  convert:  { label: Convert,  order: 1, icon: refresh,  description: "Convert images to and from other formats." }
  compress: { label: Compress, order: 2, icon: compress, description: "Reduce image file size." }
  resize:   { label: Resize,   order: 3, icon: crop,     description: "Resize and scale images." }
  edit:     { label: Edit,     order: 4, icon: edit,     description: "Crop, rotate, watermark and enhance images." }
  ai:       { label: AI,       order: 5, icon: sparkles, description: "AI-powered image tools." }
