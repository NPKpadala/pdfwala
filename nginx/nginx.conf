    }
}

# =============================================================================
# DEMO.NPKPADALA.COM — RotatePro demo tenant (port 3000)
# v1.9 — added 2026-06-21 to fix Cloudflare 526 (no vhost existed; SNI fell
# back to default which served the wrong cert). Cert reuses the existing
# npkpadala.com Let's Encrypt cert — Cloudflare SSL mode for this zone must
# be set to "Full" (not "Full Strict") because the cert SAN does NOT include
# demo.npkpadala.com. Long-term replacement: Cloudflare Origin Certificate
# for *.npkpadala.com.
# =============================================================================
server {
    listen 80;
    server_name demo.npkpadala.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name demo.npkpadala.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/npkpadala.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npkpadala.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $realip_remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# =============================================================================
# pdf.npkpadala.com — PDFWala served at its OWN ROOT (dedicated product domain)
# Reuses global resolver + rate-limit zones defined at the top of this file.
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name pdf.npkpadala.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pdf.npkpadala.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf.npkpadala.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Real client IP from Cloudflare (so rate-limit buckets are per-user)
    set_real_ip_from 103.21.244.0/22;  set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;   set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;  set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;  set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;  set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;   set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;   set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;   set_real_ip_from 2c0f:f248::/32;
    real_ip_header     CF-Connecting-IP;

    set $pdfwala_backend "pdfwala-app:5000";

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; font-src 'self' https://cdnjs.cloudflare.com data:; connect-src 'self' https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; frame-ancestors 'none';" always;
    add_header Cache-Control              "no-store, max-age=0, must-revalidate" always;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Via;
    proxy_hide_header Server;

    gzip on; gzip_proxied any; gzip_comp_level 5; gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    client_max_body_size 11m;
    client_body_timeout   120s;
    client_header_timeout  30s;
    send_timeout           60s;
    keepalive_timeout      30s;

    proxy_next_upstream       error timeout invalid_header;
    proxy_next_upstream_tries 1;
    limit_conn conn_limit 30;

    location ~* \.(env|git|svn|htaccess|htpasswd|DS_Store|bak|sql|log)$ { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }
    location ~* /(wp-admin|wp-login|phpmyadmin|xmlrpc|actuator|\.dockerenv) { return 444; }

    # Static legal/marketing pages — crawlable (SEO + AdSense requirement)
    location ~ ^/(privacy|terms|about|contact)/?$ {
        root /usr/share/nginx/html;
        try_files /$1.html =404;
        default_type text/html;
    }

    # Pre-rendered SEO tool landing pages. If a tool has a generated page we
    # serve it (real content + working widget); otherwise fall back to the SPA.
    location ~ ^/([a-z0-9][a-z0-9-]*)/?$ {
        root /usr/share/nginx/html;
        try_files /t/$1/index.html /index.html;
    }

    # PDFWala-specific robots + sitemap (npkpadala.com root serves its own)
    location = /robots.txt  { root /usr/share/nginx/html; try_files /robots.pdf.txt  =404; default_type text/plain; }
    location = /sitemap.xml { root /usr/share/nginx/html; try_files /sitemap.pdf.xml =404; default_type application/xml; }

    # PDFWala SPA at root
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control             "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options    "nosniff"                             always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            access_log off;
        }
    }

    location = /health        { proxy_pass http://$pdfwala_backend/health;        proxy_set_header Host $host; access_log off; limit_except GET { deny all; } }
    location = /api/v1/health  { proxy_pass http://$pdfwala_backend/api/v1/health; proxy_set_header Host $host; access_log off; limit_except GET { deny all; } }

    location ~* ^/jobs/ {
        proxy_pass http://$pdfwala_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
        limit_req zone=api_limit burst=30 nodelay;
        limit_except GET { deny all; }
    }

    location ^~ /api/ {
        proxy_pass http://$pdfwala_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 11m;
        limit_req zone=upload_limit burst=25 nodelay;
        limit_except GET POST { deny all; }
    }

    location ^~ /download/ {
        proxy_pass http://$pdfwala_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        limit_req zone=dl_limit burst=10 nodelay;
        limit_except GET { deny all; }
    }
}
