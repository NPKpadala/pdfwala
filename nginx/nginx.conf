# =============================================================================
# PDFWala — Nginx Config (Cloudflare-aware)
#=============================================================================
limit_req_zone  $realip_remote_addr zone=upload_limit:10m rate=60r/m;
limit_req_zone  $realip_remote_addr zone=dl_limit:10m     rate=20r/m;
limit_req_zone  $realip_remote_addr zone=api_limit:10m    rate=10r/m;
limit_conn_zone $realip_remote_addr zone=conn_limit:10m;

# ── Docker DNS resolver ──────────────────────────────────────────────────────
# 127.0.0.11 is Docker's embedded resolver. With `valid=30s` nginx re-queries
# every 30 seconds — this is what makes proxy_pass via a runtime variable
# (below) survive container recreation. Without it, nginx would resolve
# pdfwala-app once at startup and cache that IP forever; recreating the app
# (which gives it a new IP on the bridge network) then breaks every request
# with "connect() failed (111: Connection refused)" → 502 Bad Gateway.
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

# ── Upstream ─────────────────────────────────────────────────────────────────
# Kept for reference / static name only. The `upstream` directive itself
# caches DNS at startup, so we use a runtime variable in proxy_pass below
# instead of `proxy_pass http://pdfwala_backend`.
upstream pdfwala_backend {
    server pdfwala-app:5000 max_fails=3 fail_timeout=30s;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout  60s;
}

# =============================================================================
# BLOCK DIRECT IP ACCESS
# Anyone hitting your server IP directly (bypassing Cloudflare) gets dropped.
# Your Oracle server's public IP should only accept connections from Cloudflare.
# This is the "lock your server" step from your ⚠️ REMAINING list.
# =============================================================================
server {
    listen 80  default_server;
    listen 443 default_server ssl;
    server_name _;

    # Self-signed cert just to satisfy nginx ssl syntax for default_server
    ssl_certificate     /etc/letsencrypt/live/npkpadala.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npkpadala.com/privkey.pem;

    # Drop connection silently — no response, no fingerprint
    return 444;
}

# ── pdf.npkpadala.com — port 80: ACME challenge (cert issuance) + HTTPS redirect
server {
    listen 80;
    server_name pdf.npkpadala.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }
    location / { return 301 https://$host$request_uri; }
}

# =============================================================================
# HTTP server — only for Let's Encrypt renewal
# Cloudflare handles HTTP→HTTPS redirect at edge (Always HTTPS = ON)
# so this server block only needs to exist for certbot ACME challenges
# =============================================================================
server {
    listen 80;
    server_name npkpadala.com www.npkpadala.com;

    # Let's Encrypt ACME challenge for cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Everything else — Cloudflare already redirects to HTTPS
    # but add this as fallback just in case
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS — Main server
# Cloudflare connects to this with a valid cert (Full strict mode)
# Real user IPs come from CF-Connecting-IP header
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name npkpadala.com www.npkpadala.com;
    server_tokens off;

    # ── SSL (Origin cert for Cloudflare Full strict) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/npkpadala.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npkpadala.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── Extract real user IP from Cloudflare header ───────────────────────────
    # CRITICAL: Without this, rate limiting uses Cloudflare's IP
    # and every user shares one rate limit bucket — breaking everything
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header     CF-Connecting-IP;

    # ── Backend host (variable form) ──────────────────────────────────────────
    # Using a variable here (rather than the static upstream name) forces nginx
    # to ask the Docker resolver for the IP at request time, governed by the
    # resolver's `valid=30s` TTL. This makes proxying survive `docker compose
    # up -d` recreating the app container with a new IP.
    set $pdfwala_backend "pdfwala-app:5000";

    # ── Security headers ──────────────────────────────────────────────────────
    # Note: Cloudflare adds some of these at edge too — having both is fine
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # CSP — allows cdnjs.cloudflare.com for scripts and styles so that any
    # *currently* cached version of index.html (which loads Quill from cdnjs)
    # still works during the Cloudflare cache transition. New builds load
    # Quill from /pdfwala/vendor/quill/ (same origin) so this allowance is
    # belt-and-braces; cdnjs is trusted Cloudflare-operated infrastructure.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; font-src 'self' https://cdnjs.cloudflare.com data:; connect-src 'self' https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; frame-ancestors 'none';" always;

    # ── Default Cache-Control ─────────────────────────────────────────────────
    # By default *everything* this server emits is no-store. Static asset
    # locations below override this with their own long TTL. This is the
    # belt-and-braces fix for Cloudflare serving stale HTML after a deploy:
    # HTML pages will never be cached at the edge because we explicitly
    # tell Cloudflare not to.
    add_header Cache-Control                "no-store, max-age=0, must-revalidate" always;
    add_header Cloudflare-CDN-Cache-Control "no-store, max-age=0"                  always;
    add_header CDN-Cache-Control            "no-store, max-age=0"                  always;

    # Hide backend info
    proxy_hide_header X-Powered-By;
    proxy_hide_header Via;
    proxy_hide_header Server;

    # ── Gzip (origin-level, Cloudflare serves Brotli at edge) ────────────────
    # Cloudflare decompresses gzip from origin and re-serves as Brotli to user
    # So gzip here is for the Cloudflare→Origin leg only
    gzip            on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript
        application/xml+rss image/svg+xml;

    # ── Client limits ─────────────────────────────────────────────────────────
    client_max_body_size 11m;   # 10 MB user file + multipart overhead
                                  # Free tier (20MB) enforced in Flask validators.py
    client_body_timeout   120s;
    client_header_timeout  30s;
    send_timeout           60s;
    keepalive_timeout      30s;
    keepalive_requests    100;

    # ── Proxy retry — SAFE ────────────────────────────────────────────────────
    # NEVER retry on 5xx — prevents double-processing uploads
    proxy_next_upstream       error timeout invalid_header;
    proxy_next_upstream_tries 1;

    # ── Per-IP connection limit (using real IP from Cloudflare) ───────────────
    limit_conn conn_limit 30;

    # ─────────────────────────────────────────────────────────────────────────
    # BOT BLOCKING — second line of defense after Cloudflare Bot Fight Mode
    # Blocks anything that slips past Cloudflare (direct crawlers, VPN bots)
    # ─────────────────────────────────────────────────────────────────────────
    location ~* \.(env|git|svn|htaccess|htpasswd|DS_Store|bak|sql|log)$ {
        return 444;
    }
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 444;
    }
    location ~* /(wp-admin|wp-login|phpmyadmin|xmlrpc|actuator|\.dockerenv) {
        return 444;
    }
    if ($http_user_agent ~* (zgrab|masscan|nmap|gobuster|sqlmap|nikto|nessus|dirbuster|nuclei)) {
        return 444;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # ROOT
    # ─────────────────────────────────────────────────────────────────────────
    # Root now serves the portfolio landing page. PDFWala keeps its own home at
    # /pdfwala/ (unchanged); /ops, /demo and the API paths are untouched.
    location = / {
        root /usr/share/nginx/html;
        try_files /portfolio.html =404;
        default_type text/html;
    }

    # Root-level static assets for the portfolio (social preview image, etc.)
    location = /og.png {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Self-hosted portfolio assets: compiled fonts (woff2/css) + GSAP. No CDNs.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /robots.txt  { root /usr/share/nginx/html; }
    location = /sitemap.xml { root /usr/share/nginx/html; default_type application/xml; }

    # ─────────────────────────────────────────────────────────────────────────
    # HEALTH CHECK
    # Cloudflare cache rule: /api/ → bypass — so health check is never cached
    # ─────────────────────────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://$pdfwala_backend/health;
        proxy_set_header Host $host;
        access_log off;
        limit_except GET { deny all; }
    }

    location = /api/v1/health {
        proxy_pass http://$pdfwala_backend/api/v1/health;
        proxy_set_header Host $host;
        access_log off;
        limit_except GET { deny all; }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # STATIC FILES — /pdfwala/
    # Cloudflare caches these at edge for 2 hours (your cache rule)
    # Nginx serves them from disk when Cloudflare cache misses
    # ─────────────────────────────────────────────────────────────────────────
    # PDFWala now lives at https://pdf.npkpadala.com — 301 the old path there.
    # (The /pdfwala/api/ and /pdfwala/download/ blocks below still proxy so any
    #  cached old client keeps working; the page + SPA routes redirect.)
    location ^~ /pdfwala/ {
        rewrite ^/pdfwala/(.*)$ https://pdf.npkpadala.com/$1 permanent;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # JOB STATUS POLLING — /pdfwala/api/v1/jobs/<id>
    # Must match BEFORE the general /pdfwala/api/ block
    # Cloudflare cache: /api/ → bypass (correct — job status must be live)
    # Higher rate limit: polling every 5s needs burst headroom
    # ─────────────────────────────────────────────────────────────────────────
    location ~* ^/pdfwala/api/v1/jobs/ {
        proxy_pass http://$pdfwala_backend$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $realip_remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header Connection        "";

        proxy_buffering      off;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;    # job status is instant

        limit_req zone=api_limit burst=30 nodelay;
        limit_except GET { deny all; }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # JOB STATUS POLLING — flat /jobs/<id>  (frontend polls this URL directly)
    # status_url returned by backend is /jobs/<id> — must be routed here
    # ─────────────────────────────────────────────────────────────────────────
    location ~* ^/jobs/ {
        proxy_pass http://$pdfwala_backend$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $realip_remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering      off;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        limit_req zone=api_limit burst=30 nodelay;
        limit_except GET { deny all; }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # API — /pdfwala/api/ (browser) and /api/ (direct)
    # Cloudflare cache rule: /api/ → bypass (correct)
    # Rate limit: 3 uploads/min per IP (strict — processing is expensive)
    # Timeout: 3600s = 60 min (matches OCR task time_limit)
    # ─────────────────────────────────────────────────────────────────────────
    # CRITICAL nginx gotcha: when proxy_pass uses a *variable* host, the
    # "URI" portion of proxy_pass (e.g. /api/) is taken LITERALLY — nginx
    # does NOT auto-append the rest of the request URI like it does with
    # a static upstream. The correct forms are:
    #   - proxy_pass http://$var;                  → passes $uri (after rewrite)
    #   - proxy_pass http://$var$request_uri;      → passes the full original URI
    # Using `proxy_pass http://$var/api/;` would send literally /api/ to the
    # backend and lose /pdf/compress etc. — which is exactly the 404 bug
    # users hit after the DNS-resolver fix went in.
    location ^~ /pdfwala/api/ {
        # Strip the /pdfwala prefix so the backend sees /api/...
        rewrite ^/pdfwala(/api/.*)$ $1 break;
        proxy_pass http://$pdfwala_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $realip_remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header Connection        "";

        proxy_buffering         off;
        proxy_request_buffering off;    # stream uploads directly — no RAM buffer
        proxy_connect_timeout   60s;
        proxy_read_timeout      3600s;  # 60 min for large OCR / chunked jobs
        proxy_send_timeout      3600s;

        client_max_body_size 11m;

        limit_req zone=upload_limit burst=25 nodelay;
        limit_except GET POST { deny all; }
    }

    location ^~ /api/ {
        proxy_pass http://$pdfwala_backend$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $realip_remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header Connection        "";

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_connect_timeout   60s;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;

        client_max_body_size 11m;

        limit_req zone=upload_limit burst=25 nodelay;
        limit_except GET POST { deny all; }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # DOWNLOADS — /pdfwala/download/ and /download/
    # Cloudflare cache rule: /download/ → bypass (correct — signed URLs unique)
    # Only GET allowed. Signed URL verified in Flask.
    # ─────────────────────────────────────────────────────────────────────────
    location ^~ /pdfwala/download/ {
        rewrite ^/pdfwala(/download/.*)$ $1 break;
        proxy_pass http://$pdfwala_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $realip_remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 600s;    # 10 min for large file download

        limit_req zone=dl_limit burst=10 nodelay;
        limit_except GET { deny all; }
    }

    location ^~ /download/ {
        proxy_pass http://$pdfwala_backend$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $realip_remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 600s;

        limit_req zone=dl_limit burst=10 nodelay;
        limit_except GET { deny all; }
    }
    # ── AI Chat ──────────────────────────────────────────────────────
    location /ai/ {
        proxy_pass http://host.docker.internal:8088/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    
    # ── Ollama API ───────────────────────────────────────────────────
    location /ollama/ {
        proxy_pass http://host.docker.internal:11434/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ── RotatePro Demo (isolated test DB) ────────────────────────────
    location /demo {
        return 301 /demo/;
    }
    location /demo/ {
        set $demo_backend "host.docker.internal:3000";
        rewrite ^/demo/(.*) /$1 break;
        proxy_pass         http://$demo_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $realip_remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;

        proxy_redirect ~^(https?://[^/]+)/(.*) $1/demo/$2;
    }

    # ── Ops Monitor (internal NOC dashboard) ─────────────────────────
    location = /ops { return 301 /ops/; }
    location /ops/ {
        proxy_pass         http://host.docker.internal:8090/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $realip_remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;     # keep the realtime WebSocket alive
        proxy_buffering    off;
        client_max_body_size 5m;
    }

}

# =============================================================================
# SAHASRA.LOAN — Client 1
# =============================================================================
server {
    listen 80;
    server_name sahasra.loan www.sahasra.loan;
    location /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sahasra.loan;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/sahasra.loan/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sahasra.loan/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $realip_remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

